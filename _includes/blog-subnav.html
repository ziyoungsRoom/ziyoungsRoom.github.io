{%- assign bc = site.data.blog_categories -%}
{%- if bc and bc.categories -%}
<nav class="blog-subnav" aria-label="블로그 카테고리">
  <p class="blog-subnav__links">
    <a href="{{ bc.path_prefix | append: '/' | relative_url }}"
       class="blog-subnav__link{% if page.layout == 'blog-all' %} blog-subnav__link--active{% endif %}">전체</a>
    {%- for c in bc.categories -%}
      {%- assign cat_url = bc.path_prefix | append: '/' | append: c.slug | append: '/' -%}
      <span class="blog-subnav__sep">·</span>
      <a href="{{ cat_url | relative_url }}"
         class="blog-subnav__link{% if page.layout == 'blog-category' and page.category_slug == c.slug %} blog-subnav__link--active{% endif %}">{{ c.title | escape }}</a>
    {%- endfor -%}
  </p>
</nav>
{%- endif -%}
